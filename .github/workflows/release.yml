name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate calculator and conversion behavior
        run: node --test tests/*.test.js
      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep -m1 "versionName" app/build.gradle | sed -E "s/.*'([^']+)'.*/\1/")
          VERSION_CODE=$(grep -m1 "versionCode" app/build.gradle | awk '{print $2}')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION_NAME" ]; then
            echo "Tag v$TAG does not match versionName $VERSION_NAME" >&2
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Load release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ROVNO_KEYSTORE_BASE64 }}
          ROVNO_STORE_PASSWORD: ${{ secrets.ROVNO_STORE_PASSWORD }}
          ROVNO_KEY_ALIAS: ${{ secrets.ROVNO_KEY_ALIAS }}
          ROVNO_KEY_PASSWORD: ${{ secrets.ROVNO_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ROVNO_STORE_PASSWORD" ] || [ -z "$ROVNO_KEY_ALIAS" ] || [ -z "$ROVNO_KEY_PASSWORD" ]; then
            echo 'Release signing requires all four ROVNO secrets.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rovno-release.jks"
          echo "ROVNO_KEYSTORE=$RUNNER_TEMP/rovno-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APKs
        env:
          ROVNO_STORE_PASSWORD: ${{ secrets.ROVNO_STORE_PASSWORD }}
          ROVNO_KEY_ALIAS: ${{ secrets.ROVNO_KEY_ALIAS }}
          ROVNO_KEY_PASSWORD: ${{ secrets.ROVNO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PtestBuildType=release testDebugUnitTest lintRelease assembleRelease assembleReleaseAndroidTest
      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/rovno-release.jks"
      - name: Verify release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          EXPECTED_FINGERPRINT: 5e6dfbfd407fa98aaf198234a0a2b35137fa11c82fe219f93580a5b025483e8f
        run: |
          chmod +x scripts/verify-apk.sh
          scripts/verify-apk.sh \
            app/build/outputs/apk/release/app-release.apk \
            "$EXPECTED_FINGERPRINT" \
            com.rovno.app \
            "${{ steps.version.outputs.version_name }}" \
            "${{ steps.version.outputs.version_code }}"
      - name: Package release deliverables
        run: |
          mkdir -p release smoke-apks
          cp app/build/outputs/apk/release/app-release.apk release/rovno.apk
          cp app/build/outputs/apk/release/app-release.apk smoke-apks/app-release.apk
          cp app/build/outputs/apk/androidTest/release/app-release-androidTest.apk smoke-apks/app-release-androidTest.apk
          cd release
          sha256sum rovno.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-smoke-apks
          if-no-files-found: error
          path: smoke-apks/*
      - uses: actions/upload-artifact@v4
        with:
          name: rovno-release
          path: release/*

  emulator-api26:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-release-smoke-apks
          path: apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: |
            adb install apks/app-release.apk
            adb install apks/app-release-androidTest.apk
            adb shell pm clear com.rovno.app
            adb shell am instrument -w com.rovno.app.test/com.rovno.app.SmokeInstrumentation | tee smoke-api26.txt
            grep -q 'Rovno smoke passed' smoke-api26.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-api26
          path: smoke-api26.txt

  emulator-api35:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-release-smoke-apks
          path: apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: |
            adb install apks/app-release.apk
            adb install apks/app-release-androidTest.apk
            adb shell pm clear com.rovno.app
            adb shell am instrument -w com.rovno.app.test/com.rovno.app.SmokeInstrumentation | tee smoke-api35.txt
            grep -q 'Rovno smoke passed' smoke-api35.txt
            adb shell am start -n com.rovno.app/.MainActivity
            sleep 3
            adb exec-out screencap -p > android-preview.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-api35
          path: |
            smoke-api35.txt
            android-preview.png

  publish:
    needs: [build, emulator-api26, emulator-api35]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rovno-release
          path: release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Rovno ${{ needs.build.outputs.version_name }}
          body: |
            Signed Android APK for `com.rovno.app`.

            - Version: `${{ needs.build.outputs.version_name }}` (`versionCode` ${{ needs.build.outputs.version_code }})
            - Certificate SHA-256: `5e6dfbfd407fa98aaf198234a0a2b35137fa11c82fe219f93580a5b025483e8f`
            - Source commit: `${{ github.sha }}`

            Verify after download:
            ```sh
            sha256sum -c SHA256SUMS.txt
            ```
          files: |
            release/rovno.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
