name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      emulator:
        description: 'Also run Android emulator smoke check'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate calculator and conversion behavior
        run: node --test tests/*.test.js
      - name: Load release signing key when configured
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ROVNO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rovno-release.jks"
            echo "ROVNO_KEYSTORE=$RUNNER_TEMP/rovno-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Test, lint, and build release APK
        env:
          ROVNO_STORE_PASSWORD: ${{ secrets.ROVNO_STORE_PASSWORD }}
          ROVNO_KEY_ALIAS: ${{ secrets.ROVNO_KEY_ALIAS }}
          ROVNO_KEY_PASSWORD: ${{ secrets.ROVNO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Name APK deliverables
        run: |
          mkdir -p release
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release/rovno-v0.1.0.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk release/rovno-v0.1.0-unsigned.apk
          fi
          cd release
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rovno-release
          path: release/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
      - uses: actions/upload-artifact@v4
        with:
          name: android-smoke-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk

  emulator:
    if: github.event_name == 'workflow_dispatch' && inputs.emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-smoke-apks
          path: apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          script: |
            adb install apks/debug/app-debug.apk
            adb install apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.rovno.app.test/com.rovno.app.SmokeInstrumentation | tee smoke.txt
            grep -q 'Rovno smoke passed' smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-result
          path: smoke.txt
