plugins { id 'com.android.application' }

def releaseStore = System.getenv('ROVNO_KEYSTORE')
def releaseStorePassword = System.getenv('ROVNO_STORE_PASSWORD')
def releaseAlias = System.getenv('ROVNO_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ROVNO_KEY_PASSWORD')
def canSign = [releaseStore, releaseStorePassword, releaseAlias, releaseKeyPassword].every { it }

android {
    namespace 'com.rovno.app'
    compileSdk 35
    buildFeatures { buildConfig true }
    testBuildType = providers.gradleProperty('testBuildType').getOrElse('debug')
    defaultConfig {
        applicationId 'com.rovno.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'com.rovno.app.SmokeInstrumentation'
    }
    signingConfigs {
        if (canSign) {
            release {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (canSign) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; checkReleaseBuilds true }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
